post:
  summary: Remove a member from the organization through the leave lifecycle
  description: >
    Leave, performed for the member: their decisions applied, the claim
    removed, the membership set inactive, their tenant data purged after the
    dormancy window. Concerns this tenant only, so it is offered even when
    the member belongs to other organizations. The tenant is the request's host, like every /admin-api call.
  operationId: leaveTenantForMember
  parameters:
    - name: userid
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: "../../core-schema.yaml#/components/schemas/LeaveTenantRequest"
  responses:
    "204":
      description: Membership ended
    "403":
      description: The caller acted on themselves, or on somebody who outranks them
      content:
        application/json:
          schema:
            $ref: "../../core-schema.yaml#/components/schemas/ErrorSchema"
    "404":
      description: The user is not an active member of this tenant
      content:
        application/json:
          schema:
            $ref: "../../core-schema.yaml#/components/schemas/ErrorSchema"
    "409":
      description: An impact of severity `decision` is unresolved
      content:
        application/json:
          schema:
            $ref: "../../core-schema.yaml#/components/schemas/LeaveTenantPreview"
