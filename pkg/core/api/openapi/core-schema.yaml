components:
  schemas:
    # Tenant related schemas
    NewTenant:
      $ref: "./parts/tenant-new-schema.yaml"
    Tenant:
      $ref: "./parts/tenant-schema.yaml"
    TenantProfile:
      $ref: "./parts/tenant-profile-schema.yaml"
    TenantFeatures:
      $ref: "./parts/tenant-features-schema.yaml"
    TenantFeatureLicenses:
      $ref: "./parts/tenant-feature-licenses-schema.yaml"
    ColorSchema:
      $ref: "./parts/tenant-color-schema.yaml"
    # Users
    Identify:
      $ref: "./parts/auth/identify-schema.yaml"
    SocialSignInResult:
      $ref: "./parts/auth/social-complete-schema.yaml"
    # Self-service membership lifecycle (ADR 040 in the LMS repo).
    # Defined inline rather than in parts/: a schema part may only reference
    # other parts, never back into this file, and these need Role, User and
    # TenantFeatureLicenses.
    TenantMembership:
      type: object
      description: >
        One row of core_user_tenant_memberships joined to its tenant. Field names
        are snake_case because this payload predates its spec — it is the sqlc
        row, serialized as-is, and a live SPA already reads it. Renaming is a
        separate, breaking decision.
      required: [id, user_id, tenant_id, status, tenant_name, subdomain]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
        tenant_id:
          type: string
        status:
          type: string
          enum: [active, pending, inactive, rejected]
          description: >
            `inactive` is a membership that ended — left or removed. The row is
            kept because reactivating it is what restores a returning member's
            history.
        invited_by:
          type: string
          nullable: true
        invited_at:
          type: string
          format: date-time
          nullable: true
        joined_at:
          type: string
          format: date-time
          nullable: true
          description: Null while pending — only an accepted membership has joined.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        feature_licenses:
          $ref: "#/components/schemas/TenantFeatureLicenses"
        tenant_name:
          type: string
        subdomain:
          type: string
    LeaveImpact:
      type: object
      description: >
        Contributed by the module that owns the data. Core cannot enumerate it,
        so `key` is open-ended.
      required: [key, severity]
      properties:
        module:
          type: string
          description: Module that contributed this impact, e.g. `lms`.
        key:
          type: string
          description: >
            Stable identifier used as a translation key by the SPA, e.g.
            `lms.enrollments`, `lms.authoredPublishedCourses`,
            `lms.activeSubscription`.
        label:
          type: string
          description: Fallback text for a key the SPA has no translation for.
        count:
          type: integer
        severity:
          type: string
          enum: [info, decision]
          description: >
            `info` is stated in the dialog. `decision` must be resolved by a
            matching entry in LeaveTenantRequest.decisions.
        actions:
          type: array
          description: Actions this decision accepts, in the order to offer them.
          items:
            type: string
            enum: [transfer, keep, unpublish, cancelAtPeriodEnd]
    LeaveTenantPreview:
      type: object
      description: >
        What leaving would cost, and nothing else. Identity and membership facts
        already came with the row this dialog was opened from.
      required: [canLeaveNow, impacts]
      properties:
        canLeaveNow:
          type: boolean
          description: False while an impact of severity `decision` is unanswered.
        dormantUntil:
          type: string
          format: date-time
          description: >
            When the tenant-scoped data kept for a possible return would be
            purged if the caller leaves now. The membership row itself is never
            purged — it is what makes returning a reactivation.
        impacts:
          type: array
          items:
            $ref: "#/components/schemas/LeaveImpact"
    LeaveDecision:
      type: object
      description: One answer to an impact the preview reported with severity `decision`.
      required: [key, action]
      properties:
        key:
          type: string
          description: The impact key being answered, e.g. `lms.authoredPublishedCourses`.
        action:
          type: string
          enum: [transfer, keep, unpublish, cancelAtPeriodEnd]
        targetUserId:
          type: string
          description: Required for `transfer` — the member the content moves to.
    LeaveTenantRequest:
      type: object
      properties:
        decisions:
          type: array
          description: >
            One entry per impact the preview reported with severity `decision`.
            Absent or incomplete, the leave is refused with 409 and the current
            preview.
          items:
            $ref: "#/components/schemas/LeaveDecision"
        reason:
          type: string
          maxLength: 500
          description: Optional, free text. Product feedback only; never gates the leave.
    LeaveTenantResult:
      type: object
      required: [membershipStatus]
      properties:
        membershipStatus:
          type: string
          enum: [inactive]
          description: >
            The row is kept, not deleted. Reactivating it is how a returning user
            gets their history back.
        dormantUntil:
          type: string
          format: date-time
        seatReleased:
          type: boolean
    AccountDeletion:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [none, scheduled]
        scheduledAt:
          type: string
          format: date-time
          description: When the caller asked for deletion.
        scheduledFor:
          type: string
          format: date-time
          description: >
            When the deletion executes. Until then the account can be recovered
            by signing in and cancelling; after it, nothing is recoverable.
        tenantsAffected:
          type: integer
          description: Memberships that end with the account.
        exportAvailable:
          type: boolean
          description: Whether GET /api/v1/users/me/export can still be called.
    AccountClosurePreview:
      type: object
      description: >
        One entry per active membership. Closing ends them all, so the caller is
        shown every organization's cost at once rather than discovering them one
        at a time after the fact.
      required: [tenants]
      properties:
        tenants:
          type: array
          items:
            $ref: "#/components/schemas/TenantClosureImpact"
    TenantClosureImpact:
      type: object
      required: [tenantId, tenantName, impacts]
      properties:
        tenantId:
          type: string
          description: >
            Named in the response, never in a request: it identifies which answer
            belongs to which organization, not which tenant the call acts on.
        tenantName:
          type: string
        subdomain:
          type: string
        impacts:
          type: array
          items:
            $ref: "#/components/schemas/LeaveImpact"
    TenantLeaveDecision:
      type: object
      description: A LeaveDecision bound to the organization it answers for.
      required: [tenantId, key, action]
      properties:
        tenantId:
          type: string
        key:
          type: string
        action:
          type: string
          enum: [transfer, keep, unpublish, cancelAtPeriodEnd]
        targetUserId:
          type: string
    AccountDeletionRequest:
      type: object
      required: [confirmEmail]
      properties:
        decisions:
          type: array
          description: >
            What to do with the content the caller owns, per organization. Stored
            with the schedule and applied at execution — not now, so cancelling
            leaves nothing to undo. Anything unanswered falls back to the
            owning module's policy.
          items:
            $ref: "#/components/schemas/TenantLeaveDecision"
        confirmEmail:
          type: string
          format: email
          description: >
            Must equal the caller's own email. Verified server-side — the typed
            confirmation is a real check, not a client-side speed bump.
        reason:
          type: string
          maxLength: 500
    UserDataExport:
      type: object
      description: >
        Assembled by core from what it owns, plus one section per registered data
        contributor. Core cannot enumerate module data — `modules` is
        deliberately open, and its keys are the contributors that answered, which
        is also how a reader sees what the export covered.
      required: [exportedAt, user, memberships, modules]
      properties:
        exportedAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/TenantMembership"
        modules:
          type: object
          additionalProperties: true
          description: >
            Keyed by contributor name (`lms`, `aiemployee`, …). The shape of each
            value is the contributing module's business, not core's.
    NewSignUp:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        function:
          type: string
        company:
          type: string
    NewUser:
      type: object
      required:
        - name
        - email
        - roles
      properties:
        name:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        silent:
          type: boolean
          description: When true, suppress invitation and welcome emails (both the synchronous Kratos welcome and any asynchronous onboarding follow-up).
    Role:
      type: string
      enum: [USER, ADMIN, CUSTOMER_ADMIN, SUPER_ADMIN]
    User:
      type: object
      required:
        - id
        - name
        - email
        - roles
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        disabled:
          type: boolean
        email_verified:
          type: boolean
        profile:
          $ref: "#/components/schemas/UserProfileSchema"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        created_at:
          type: string
          format: date-time
        membership_status:
          type: string
          description: Membership status (active, inactive, etc.)
          nullable: true
        auth_state:
          type: string
          description: >-
            Identity state at the auth provider — "active", "inactive", or
            "missing" when the provider answered and has no identity for this
            user (a row left behind by an earlier auth provider; nobody can
            sign in as it). Null means the provider could not be asked, which
            is not the same as "missing".
          nullable: true
        last_seen_at:
          type: string
          format: date-time
          description: >-
            When the user was last active: the later of our own request-path
            stamp (throttled, so it lags by a few minutes) and their last
            authentication, since signing in is itself activity. Never earlier
            than last_authenticated_at. Distinct from last_authenticated_at,
            which counts only credential entry and can be weeks older on a
            long-lived session. Null means no activity recorded since the
            column was introduced.
          nullable: true
        last_authenticated_at:
          type: string
          format: date-time
          description: >-
            When the user most recently authenticated, taken from the newest
            session the auth provider still holds. Null means no session on
            record — which after session pruning is not the same as "never
            signed in".
          nullable: true
    UserProfileSchema:
      $ref: "./parts/users/user-profile-schema.yaml"
    UserActionSchema:
      $ref: "./parts/users/user-action-schema.yaml"

    # MFA related schemas
    MFAStatus:
      type: object
      required:
        - totp_enabled
        - webauthn_enabled
        - recovery_codes_set
        - available_methods
        - aal
      properties:
        totp_enabled:
          type: boolean
          description: Whether TOTP (Authenticator App) is enabled
        webauthn_enabled:
          type: boolean
          description: Whether WebAuthn (Security Key) is enabled
        recovery_codes_set:
          type: boolean
          description: Whether recovery codes have been generated
        available_methods:
          type: array
          items:
            type: string
          description: List of available MFA methods
        aal:
          type: string
          description: Current Authenticator Assurance Level
          enum: [aal1, aal2]
    SettingsFlow:
      type: object
      description: Kratos settings flow object (simplified representation)
      properties:
        id:
          type: string
          description: Flow ID
        ui:
          type: object
          description: UI configuration for the flow
          properties:
            action:
              type: string
              description: URL to submit the flow to
            method:
              type: string
              description: HTTP method to use
            nodes:
              type: array
              description: Form nodes for the UI
              items:
                type: object
        expires_at:
          type: string
          format: date-time
          description: When the flow expires
        issued_at:
          type: string
          format: date-time
          description: When the flow was issued

    # Client Application related schemas
    NewClientApplication:
      type: object
      required:
        - name
        - active
        - description
      properties:
        name:
          type: string
        description:
          type: string
        active:
          type: boolean
        lastUsed:
          type: string
          format: date-time

    ClientApplication:
      allOf:
        - $ref: "#/components/schemas/NewClientApplication"
        - type: object
          required:
            - id
          properties:
            id:
              type: string
              format: uuid
            lastUsedAt:
              type: string
              format: date-time
            tenantId:
              type: string
              nullable: true
              description: If null, this is a global application managed by SUPER_ADMIN

    # API Token related schemas
    NewAPIToken:
      type: object
      required:
        - name
        - clientApplicationId
        - tokenPrefix
        - expiresAt
      properties:
        name:
          type: string
        description:
          type: string
        expiresAt:
          type: string
          format: date-time
        clientApplicationId:
          type: string
          format: uuid
          description: ID of the client application this token belongs to
        tokenPrefix:
          type: string
          description: First few characters of the token for identification
        scopes:
          type: array
          items:
            type: string
          nullable: true
          description: Permission scopes for this token

    APIToken:
      allOf:
        - $ref: "#/components/schemas/NewAPIToken"
        - type: object
          required:
            - id
            - status
            - revoked
            - createdBy
            - createdAt
            - updatedAt
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum: [ACTIVE, REVOKED, EXPIRED]
            revoked:
              type: boolean
              description: Whether this token has been revoked
            revokedAt:
              type: string
              format: date-time
              description: Token revoked at timestamp
            revokedReason:
              type: string
              description: Revoked reason
            revokedBy:
              type: string
              description: User of the token revoker
            lastUsedAt:
              type: string
              format: date-time
              description: Last used timestamp
            lastUsedIp:
              type: string
              description: Last used IP address
            createdBy:
              type: string
              description: User ID of the token creator
            createdAt:
              type: string
              format: date-time
              description: Token creation timestamp
            updatedAt:
              type: string
              format: date-time
              description: Token last update timestamp

    APITokenCreated:
      type: object
      required:
        - token
        - apiToken
      properties:
        token:
          type: string
          description: The full token value (only returned once upon creation)
        apiToken:
          $ref: "#/components/schemas/APIToken"
    APITokenRevoke:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
    APITokenAuditLog:
      type: object
      required:
        - id
        - tokenId
        - action
        - timestamp
      properties:
        id:
          type: string
          format: uuid
        tokenId:
          type: string
          format: uuid
        action:
          type: string
          enum: [CREATED, USED, REVOKED, UPDATED]
        ipAddress:
          type: string
          nullable: true
        userAgent:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
        additionalData:
          type: object
          nullable: true
    NewConfig:
      $ref: "./parts/configs/config-new-schema.yaml"
    Config:
      $ref: "./parts/configs/config-schema.yaml"

    # Common
    BasicEntity:
      $ref: "./parts/basic-entity-schema.yaml"
    ErrorSchema:
      $ref: "./parts/error-schema.yaml"

    # Public
    PublicTenantSchema:
      $ref: "./parts/public-tenant-schema.yaml"

    # Health
    HealthResponse:
      $ref: "./parts/health/health-response-schema.yaml"
    CheckDetails:
      $ref: "./parts/health/check-details-schema.yaml"

    # Translations
    NewTranslation:
      $ref: "./parts/translations/translation-new-schema.yaml"
    Translation:
      $ref: "./parts/translations/translation-schema.yaml"

  responses:
    UnauthorizedError:
      description: Unauthorized - authentication required
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "unauthorized"
              message:
                type: string
                example: "Authentication required"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "internal_error"
              message:
                type: string
                example: "An internal error occurred"
